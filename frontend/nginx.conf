# Este archivo se incluye dentro del bloque http de la imagen oficial.
map $uri $static_cache_control {
    default "no-cache";
    ~^/api/ "";
    "~^/assets/.*-[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9.]+$" "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 256k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $static_cache_control;

    # Docker Compose proporciona este DNS dentro de su red.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location = /api {
        return 404;
    }

    location /api/ {
        # Resolución al atender la solicitud: permite arrancar Nginx aunque
        # el backend todavía no esté disponible. Se conserva ruta y query.
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_intercept_errors off;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
