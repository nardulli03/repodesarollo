services:
  postgres-test:
    image: postgres:18.6
    environment:
      POSTGRES_DB: cursos_test
      POSTGRES_USER: cursos_test
      POSTGRES_PASSWORD: cursos_test_local
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cursos_test -d cursos_test"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s